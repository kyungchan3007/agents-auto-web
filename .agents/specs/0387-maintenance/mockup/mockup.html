<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Flapfx 점검 중</title>
<style>
:root { --blue: #2438a8; --ink: #16246e; --yellow: #f7c548; --paper: #ffffff; }
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body { word-break: keep-all; background: var(--blue); color: #fff; font-family: Pretendard, "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif; display: flex; flex-direction: column; min-height: 100%; }
header { padding: 22px clamp(16px, 5vw, 72px); }
.logo { font-weight: 800; font-size: 24px; letter-spacing: -0.03em; color: #fff; text-decoration: none; }
.logo i { font-style: normal; color: var(--yellow); }
main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px 16px 64px; text-align: center; }
.board { display: grid; grid-template-columns: repeat(5, clamp(44px, 13vw, 76px)); gap: clamp(4px, 1vw, 8px); padding: clamp(10px, 2vw, 16px); background: #16246e; border-radius: 14px; box-shadow: 0 18px 40px rgba(0,0,0,.25); }
.cell { position: relative; height: clamp(58px, 17vw, 96px); background: #1d2f8c; border-radius: 6px; display: grid; place-items: center; overflow: hidden; font-weight: 800; font-size: clamp(30px, 9vw, 54px); color: var(--yellow); }
.cell::after { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 2px; background: rgba(0,0,0,.35); }
.cell span { display: block; animation: flip .5s cubic-bezier(.3,1.4,.5,1) both; }
.cell:nth-child(2) span { animation-delay: .08s; } .cell:nth-child(3) span { animation-delay: .16s; } .cell:nth-child(4) span { animation-delay: .24s; } .cell:nth-child(5) span { animation-delay: .32s; }
@keyframes flip { from { transform: rotateX(90deg); opacity: 0; } to { transform: none; opacity: 1; } }
h1 { margin-top: clamp(28px, 5vw, 40px); font-size: clamp(26px, 6vw, 40px); font-weight: 800; letter-spacing: -0.03em; line-height: 1.25; }
p { margin-top: 14px; font-size: clamp(15px, 3.8vw, 17px); line-height: 1.6; color: rgba(255,255,255,.85); max-width: 32em; text-wrap: balance; }
.when { display: inline-block; margin-top: 22px; padding: 8px 16px; border-radius: 999px; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.28); font-size: 14px; font-weight: 600; }
.when b { color: var(--yellow); font-weight: 700; }
footer { padding: 18px 16px 24px; text-align: center; font-size: 13px; color: rgba(255,255,255,.6); }
@media (prefers-reduced-motion: reduce) { .cell span { animation: none; } }
</style>
</head>
<body>
<header><a class="logo" href="/">flap<i>fx</i></a></header>
<main>
  <div class="board" aria-hidden="true"><div class="cell"><span>점</span></div><div class="cell"><span>검</span></div><div class="cell"><span></span></div><div class="cell"><span>중</span></div><div class="cell"><span>✈</span></div></div>
  <h1>잠시 점검 중입니다</h1>
  <p>더 정확한 환율 · 물가를 보여 드리기 위해 사이트를 점검하고 있습니다.<br>잠시 후 다시 방문해 주시기 바랍니다.</p></main>
<footer>Flapfx · 환율 · 물가로 보는 여행 · 직구 타이밍</footer>
</body>
</html>
