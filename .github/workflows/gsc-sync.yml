name: gsc-sync
# Search Console 노출 · 클릭 · 검색어를 D1 에 저장 → /geo (작업 0130)
#   GSC_SERVICE_ACCOUNT_JSON 은 사람이 등록한 비밀값 · 없으면 건너뜀 · 키 · 토큰은 출력하지 않음
on:
  schedule:
    - cron: "20 19 * * *" # 한국 04:20
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gsc-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      HAS_KEY: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - name: 비밀값 확인
        id: secrets
        run: |
          if [ "$HAS_KEY" != "true" ] || [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "비밀값이 없어 건너뜁니다" >> "$GITHUB_STEP_SUMMARY"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ok == 'true'
      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.ok == 'true'
        with:
          node-version: 22
      - if: steps.secrets.outputs.ok == 'true'
        run: npm ci
      - name: Search Console → SQL
        if: steps.secrets.outputs.ok == 'true'
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
        run: |
          mkdir -p .tmp
          node --experimental-strip-types apps/api/scripts/gsc-sync.ts > .tmp/gsc.sql 2>> "$GITHUB_STEP_SUMMARY"
      - name: D1 에 저장
        if: steps.secrets.outputs.ok == 'true'
        working-directory: apps/api
        run: npx wrangler d1 execute hav-db --remote --file ../../.tmp/gsc.sql --yes
        env:
          CI: "1"
