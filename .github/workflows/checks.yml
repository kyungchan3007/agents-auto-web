name: "검사 · 자동 검사 (PR · main)"
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
jobs:
  gate:
    # 라벨을 붙이거나 뗄 때는 harness-approved 일 때만 돎 (다른 라벨로 게이트가 또 도는 낭비 방지 · 작업 0243) — 그 밖 이벤트는 그대로
    if: ${{ !contains(fromJSON('["labeled","unlabeled"]'), github.event.action) || github.event.label.name == 'harness-approved' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: if [ -f package-lock.json ]; then npm ci; fi
      - run: bash .agents/checks.sh
        env:
          # 보호 파일 변경은 PR에 harness-approved 라벨을 사람이 붙였을 때만 통과
          ALLOW_PROTECTED: ${{ contains(github.event.pull_request.labels.*.name, 'harness-approved') && '1' || '0' }}
