name: "수집 · 인스타 성과 기록 (Instagram Insights)"
# 인스타 게시물 · 계정 성과를 D1 에 저장 → 어드민 알리기 탭 (작업 0323)
#   IG_USER_ID · IG_ACCESS_TOKEN 은 사람이 등록한 비밀값 · 없으면 건너뜀 · 토큰은 출력하지 않음
on:
  schedule:
    - cron: "40 19 * * *" # 한국 04:40
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ig-insights
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      HAS_KEY: ${{ secrets.IG_ACCESS_TOKEN != '' && secrets.IG_USER_ID != '' }}
    steps:
      - name: 비밀값 확인
        id: secrets
        run: |
          if [ "$HAS_KEY" != "true" ] || [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "비밀값이 없어 건너뜁니다" >> "$GITHUB_STEP_SUMMARY"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ok == 'true'
      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.ok == 'true'
        with:
          node-version: 22
      - if: steps.secrets.outputs.ok == 'true'
        run: npm ci
      - name: 인스타 → SQL
        if: steps.secrets.outputs.ok == 'true'
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          mkdir -p .tmp
          node --experimental-strip-types apps/api/scripts/ig-insights.ts > .tmp/ig.sql 2>> "$GITHUB_STEP_SUMMARY"
      - name: D1 에 저장
        if: steps.secrets.outputs.ok == 'true'
        working-directory: apps/api
        run: npx wrangler d1 execute hav-db --remote --file ../../.tmp/ig.sql --yes
        env:
          CI: "1"
