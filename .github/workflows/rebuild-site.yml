name: "배포 · 사이트 다시 만들기 (평일)"
# 사이트는 빌드할 때의 데이터를 보여 준다 → 평일 수집(03:00 UTC = 12:00 KST) 30분 뒤 사이트를 다시 빌드
# 비밀값 PAGES_DEPLOY_HOOK (Workers agents-auto-web → 설정 → 빌드 → 배포 후크 daily-rebuild 주소 · 작업 0190 · 이름은 Pages 때 그대로)이 없으면 건너뛴다 (실패 아님)
# 어드민(apps/admin · Worker flapfx-admin · 작업 0312)은 따로 배포 — 비밀값 ADMIN_DEPLOY_HOOK 이 있으면 같이 다시 빌드 · 없으면 건너뛴다 (실패 아님)
#   어드민 화면은 브라우저가 /bff 로 한 번 더 받으므로 다시 빌드가 늦어도 숫자는 최신 · 만드는 방식 숫자 · 알리기 초안은 빌드 때 저장소에서 읽음
on:
  schedule:
    - cron: "30 3 * * 1-5"
  workflow_dispatch:

jobs:
  rebuild:
    runs-on: ubuntu-latest
    env:
      HOOK: ${{ secrets.PAGES_DEPLOY_HOOK }}
      ADMIN_HOOK: ${{ secrets.ADMIN_DEPLOY_HOOK }}
    steps:
      - name: 사이트 다시 빌드 (Workers 배포 후크)
        run: |
          if [ -z "$HOOK" ]; then
            echo "PAGES_DEPLOY_HOOK 이 저장소 Secrets 에 없어 건너뜁니다" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          curl -fsS -X POST "$HOOK" > /dev/null
          echo "사이트 다시 빌드 요청함 ($(date -u +%FT%TZ))" >> "$GITHUB_STEP_SUMMARY"
      - name: 어드민 다시 빌드 (Workers 배포 후크 · 작업 0312)
        run: |
          if [ -z "$ADMIN_HOOK" ]; then
            echo "ADMIN_DEPLOY_HOOK 이 저장소 Secrets 에 없어 건너뜁니다" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          curl -fsS -X POST "$ADMIN_HOOK" > /dev/null
          echo "어드민 다시 빌드 요청함 ($(date -u +%FT%TZ))" >> "$GITHUB_STEP_SUMMARY"
