name: security-audit
# 매일 보안 점검 — Claude 없이 npm audit (작업 0118) · 고칠 것이 있으면 이슈 · 없어지면 닫음
#   앱 예약(한국 07:05 · 꺼져 있었으면 다음에 켤 때)이 이 이슈를 보고 고침 · GitHub 예약이 늦을 수 있어 넉넉히 앞에
on:
  schedule:
    - cron: "30 20 * * *" # 한국 05:30
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      LABEL: security-audit
      TITLE: "보안 점검: 고칠 의존성이 있습니다"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 점검 (취약점이 있으면 npm audit 이 실패로 끝나서 결과 파일로 판단)
        run: |
          npm audit --omit=dev --json > "$RUNNER_TEMP/prod.json" || true
          npm audit --json > "$RUNNER_TEMP/all.json" || true
          node .agents/scripts/audit-report.mjs "$RUNNER_TEMP/prod.json" "$RUNNER_TEMP/all.json" "$RUNNER_TEMP/body.md" > "$RUNNER_TEMP/count"
          echo "고칠 항목: $(cat "$RUNNER_TEMP/count")개"
      - name: 이슈 열기 · 갱신 · 닫기
        run: |
          count=$(cat "$RUNNER_TEMP/count")
          open=$(gh issue list --label "$LABEL" --state open --json number -q '.[0].number // empty' || true)
          if [ "$count" -gt 0 ]; then
            gh label create "$LABEL" --color B60205 --description "매일 보안 점검에서 나온 항목" --force
            if [ -n "$open" ]; then gh issue edit "$open" --body-file "$RUNNER_TEMP/body.md"
            else gh issue create --title "$TITLE" --label "$LABEL" --assignee kyungchan3007 --body-file "$RUNNER_TEMP/body.md"; fi
          elif [ -n "$open" ]; then
            gh issue close "$open" --reason completed --comment "다시 점검한 결과 고칠 항목이 없습니다."
          fi
