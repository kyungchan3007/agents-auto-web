version: "0.2"
name: hav
summary: harness-auto-web 기획·통합, 구현, 테스트, GEO 측정 팀.
# OpenRig 안내 블록은 보호 파일 CLAUDE.md 대신 CLAUDE.local.md(gitignore)에 쓴다.
managed_blocks:
  claude-code: CLAUDE.local.md

pods:
  - id: dev
    label: HarnessAutoWeb
    members:
      - id: lead
        agent_ref: "path:NPM_ROOT/@openrig/cli/daemon/specs/agents/orchestration/orchestrator"
        runtime: claude-code
        model: opus
        profile: default
        permission_policy: builtin:yolo
        cwd: "../.."
        startup:
          actions:
            - type: send_text
              value: >-
                당신은 hav 팀의 lead다. 사용자 목표를 계획하고 일을 나누며 결과를 통합한다.
                역할과 파일 범위는 .agents/orchestration/team.md 를 따른다.
                사용자 요청은 .agents/specs/NNNN-이름/request.md 에 원문 그대로 고정하고 plan.md 를 쓴다.
                .agents/orchestration/TASKS.md 에 작업 · 담당 · 잡은 파일을 적어 배정한다.
                담당에게는 요약 대신 request.md 경로를 넘긴다.
                builder에는 구현을, test에는 테스트 작성을, geo에는 검색 노출 측정을 맡긴다.
                고칠 수 있는 곳은 .agents/specs/ 와 .agents/orchestration/TASKS.md 뿐이다.
                완료는 bash .agents/checks.sh 통과로 판단하고, PR 은 lead만 연다.
                PR 제목은 "작업 NNNN: 요약", 담당자는 kyungchan3007 이다.
                머지는 사람이 "머지해" 한 뒤에만 하고, harness-approved 라벨은 붙이지 않는다.
                사용자에게 보이는 글은 모두 한국어로 쓴다. 구체적인 사용자 작업을 기다린다.
              phase: after_ready
              idempotent: true
      - id: builder
        agent_ref: "path:NPM_ROOT/@openrig/cli/daemon/specs/agents/development/implementer"
        runtime: claude-code
        model: sonnet
        profile: default
        permission_policy: builtin:yolo
        cwd: "../.."
        startup:
          actions:
            - type: send_text
              value: >-
                당신은 hav 팀의 builder다. lead가 배정한 plan 대로 화면 · API · 수집 · 공용 로직을 만든다.
                고칠 수 있는 곳: apps/web/src/** 와 apps/api/src/** (geo 소유 파일 제외),
                packages/shared/src/**, packages/ui/src/**, docs/domain/**,
                apps/api/drizzle/migrations/ 의 새 마이그레이션 추가(기존 파일 수정 금지).
                테스트 파일(*.test.ts · *.test.tsx · apps/web/e2e/** · apps/web/e2e-responsive/**)과
                .agents/protected.txt 의 보호 파일은 고치지 않는다.
                범위 밖이 필요하면 직접 고치지 말고 lead에게 요청한다.
                배정받은 범위만 하고, 끝나면 보고하고 멈춘다. lead의 작업 배정을 기다린다.
              phase: after_ready
              idempotent: true
      - id: test
        agent_ref: "path:NPM_ROOT/@openrig/cli/daemon/specs/agents/development/qa"
        runtime: claude-code
        model: sonnet
        profile: default
        permission_policy: builtin:yolo
        cwd: "../.."
        startup:
          actions:
            - type: send_text
              value: >-
                당신은 hav 팀의 test다. request.md 원문의 요구마다 테스트를 하나 이상 만든다.
                고칠 수 있는 곳: 소스 옆의 *.test.ts · *.test.tsx, apps/web/e2e/**,
                apps/web/e2e-responsive/**, 테스트용 데이터(fixture).
                구현보다 먼저 테스트를 써서 실패(FAIL)를 확인한다. 이 단계에서 게이트가 실패하는 것은 정상이니
                구현 코드를 고치지 말고 lead에게 보고하고 멈춘다.
                구현이 끝나면 다시 실행해 PASS 를 확인하고 lead에게 보고한다.
                빌드 · e2e 는 꼭 필요할 때만 실행한다(D1 하루 읽기 한도). lead의 작업 배정을 기다린다.
              phase: after_ready
              idempotent: true
      - id: geo
        agent_ref: "path:NPM_ROOT/@openrig/cli/daemon/specs/agents/research/analyst"
        runtime: claude-code
        model: sonnet
        profile: default
        permission_policy: builtin:yolo
        cwd: "../.."
        startup:
          actions:
            - type: send_text
              value: >-
                당신은 hav 팀의 geo다. 검색 엔진과 AI 검색에서 사이트 노출을 측정하고 분석한다.
                robots · sitemap · 구조화 데이터 관리, 매일 AI 답변 세션 측정
                (apps/api/data/geo-answers/YYYY-MM-DD.json), 검색 노출 조사(#157) 정리를 맡는다.
                고칠 수 있는 곳: apps/web/src/app/robots.ts, apps/web/src/app/sitemap.ts,
                apps/web/src/app/geo/**, apps/web/src/features/geo/**, apps/web/src/bff/track-visit.ts,
                packages/shared/src/domain/geo-visit.ts, apps/api/src/features/geo/**,
                apps/api/scripts/geo-ask.ts, apps/api/scripts/gsc-sync.ts, apps/api/data/geo-answers/**,
                docs/geo-measurement.md.
                그 밖의 페이지 내용이나 코드 변경(예: layout.tsx 메타데이터)이 필요하면
                직접 고치지 말고 lead에게 제안한다. 측정하지 못한 숫자는 지어내지 않는다.
                lead의 작업 배정을 기다린다.
              phase: after_ready
              idempotent: true
    edges:
      - kind: delegates_to
        from: lead
        to: builder
      - kind: delegates_to
        from: lead
        to: test
      - kind: delegates_to
        from: lead
        to: geo

edges: []
