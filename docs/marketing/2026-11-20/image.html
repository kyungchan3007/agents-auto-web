<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>알림 이미지 2026-11-20</title>
<link rel="stylesheet" href="/pretendard.css">
<style>
*{box-sizing:border-box;margin:0}
html,body{width:1080px;height:1350px}
body{background:#2438A8;color:#F4F9F8;font-family:'Pretendard',sans-serif;font-weight:800;position:relative;overflow:hidden}
.top{position:absolute;left:80px;right:80px;top:84px;display:flex;justify-content:space-between;align-items:center;font-size:40px;color:#C6D4F5}
.top b{color:#F7C548;font-size:46px;letter-spacing:.02em}
.ticket{position:absolute;left:60px;right:60px;top:230px;bottom:190px;background:#16246E;border-radius:40px}
.dash{position:absolute;left:60px;right:60px;top:520px;border-top:4px dashed #5568C4}
.upper{position:absolute;left:60px;right:60px;top:60px}
.label{font-size:46px;color:#C6D4F5}
.num{font-size:176px;line-height:1.05;color:#F7C548;margin-top:36px;letter-spacing:-.02em;white-space:nowrap}
.num small{font-size:72px;margin-left:10px}
.lower{position:absolute;left:60px;right:60px;top:584px}
.lower p{font-size:62px;line-height:1.35}
.lower p+p{margin-top:30px;font-size:44px;color:#C6D4F5}
.foot{position:absolute;left:80px;right:80px;bottom:84px;font-size:42px;color:#C6D4F5;text-align:center}
</style></head><body>
<div class="top"><b>flapfx</b><span>2026-11-20</span></div>
<div class="ticket">
  <div class="upper"><div class="label">오늘 유로 환율</div><div class="num">1,459.62<small>원</small></div></div>
  <div class="dash"></div>
  <div class="lower"><p>최근 90일 중 가장 낮은 값</p><p>90일 중간값은 1,513.65원</p><p>예측이 아니라 과거 값과 비교한 위치입니다</p></div>
</div>
<div class="foot">flapfx.com/currencies/EUR</div>
</body></html>
